<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - TikTok Race Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00ff88;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #2d3748;
      border-radius: 8px;
      background: #16213e;
      color: white;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #00ff88;
    }
    .team-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .team-btn {
      padding: 15px;
      border: 2px solid #2d3748;
      border-radius: 8px;
      background: #16213e;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .team-btn:hover {
      background: #2d3748;
      transform: scale(1.05);
    }
    .team-btn.selected {
      border-color: #00ff88;
      background: #00ff88;
      color: #1a1a2e;
      font-weight: bold;
    }
    .gift-presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .gift-btn {
      padding: 12px;
      border: 2px solid #2d3748;
      border-radius: 8px;
      background: #16213e;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .gift-btn img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .gift-btn:hover {
      background: #2d3748;
      transform: scale(1.05);
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #00ff88;
      color: #1a1a2e;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .submit-btn:hover {
      background: #00cc6f;
      transform: scale(1.02);
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
    .reset-btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 2px solid #ff4444;
      border-radius: 8px;
      background: transparent;
      color: #ff4444;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .reset-btn:hover {
      background: #ff4444;
      color: white;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }
    .status.success {
      background: rgba(0, 255, 136, 0.2);
      color: #00ff88;
    }
    .status.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎁 Admin Panel - Nhập Quà Tặng</h1>
    
    <div class="form-group">
      <label>Chọn đội:</label>
      <div class="team-buttons">
        <button class="team-btn" data-team="usa">🇺🇸 USA</button>
        <button class="team-btn" data-team="mexico">🇲🇽 Mexico</button>
        <button class="team-btn" data-team="germany">🇩🇪 Germany</button>
        <button class="team-btn" data-team="brazil">🇧🇷 Brazil</button>
        <button class="team-btn" data-team="palestine">🇵🇸 Palestine</button>
        <button class="team-btn" data-team="uk">🇬🇧 UK</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>Quà tặng nhanh:</label>
      <div class="gift-presets">
        <button class="gift-btn" data-gift="Hoa Hồng" data-value="1">
          <img src="images/1.webp" alt="Hoa Hồng">
          <span>Hoa Hồng<br>+1</span>
        </button>
        <button class="gift-btn" data-gift="Tiktok" data-value="2">
          <img src="images/2.webp" alt="Tiktok">
          <span>Tiktok<br>+2</span>
        </button>
        <button class="gift-btn" data-gift="Kem" data-value="3">
          <img src="images/3.webp" alt="Kem">
          <span>Kem<br>+3</span>
        </button>
        <button class="gift-btn" data-gift="Hehe" data-value="5">
          <img src="images/4.webp" alt="Hehe">
          <span>Hehe<br>+5</span>
        </button>
        <button class="gift-btn" data-gift="Mèo" data-value="10">
          <img src="images/5.webp" alt="Mèo">
          <span>Mèo<br>+10</span>
        </button>
        <button class="gift-btn" data-gift="Thương" data-value="30">
          <img src="images/6.webp" alt="Thương">
          <span>Thương<br>+30</span>
        </button>
      </div>
    </div>
    
    <button class="submit-btn" onclick="sendGift()">🎁 Gửi Quà Tặng</button>
    <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
    
    <div id="status"></div>
  </div>
  
  <script src="admin.js"></script>
</body>
</html>
